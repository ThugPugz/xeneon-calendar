<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Calendar Widget</title>

    
<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

#calendar {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.calendar-header {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 8px;

    height: 30px;
    margin-bottom: 4px;

    font-size: 18px;
    font-weight: 600;
}

.calendar-year {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
}
    
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: 40px repeat(6, minmax(0, 1fr));
    gap: 2px;

    width: 100%;
    flex: 1;
    min-height: 0;
}

.day-name {
    display: flex;
    justify-content: center;
    align-items: center;

    font-weight: bold;
    background: #333;
    border-radius: 4px;
}

.day-number {
    font-weight: bold;
    margin-bottom: 4px;
    color: #f7a2da;
}

.calendar-day {
    background: #222;
    border-radius: 6px;
    padding: 2px;
    overflow: hidden;
    box-sizing: border-box;
}

.today {
    position: relative;
    background: #2a3440;
    border: 2px solid rgba(255,255,255,0.65);

    box-shadow:
        0 0 2px rgba(255,255,255,0.15),
        0 0 5px rgba(255,255,255,0.08);
}

.calendar-event {
    font-size: 12px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    padding: 2px 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.other-month {
    background: #1d1d1d;
}

.other-month .day-number {
    color: #777;
}    
    
</style>

<script src="https://apis.google.com/js/api.js"></script>

</head>

<body>

<div id="calendar">
    Loading calendar...
</div>

<script>

const API_KEY = "AIzaSyANso--aCFdZdGTT3nYEchsVER2KUGHHGE";

const DISCOVERY_DOC =
    "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest";

async function initGoogle() {
    try {
        gapi.load("client", async () => {
            try {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: [DISCOVERY_DOC]
                });

                await loadEvents();

            } catch (err) {
                console.error("Google init error:", err);
                document.getElementById("calendar").innerHTML =
                    "Google initialization failed.";
            }
        });
    } catch (err) {
        console.error("Unexpected error:", err);
        document.getElementById("calendar").innerHTML =
            "Unexpected error.";
    }
}
                

async function loadEvents() {
    const now = new Date();

    const startOfMonth =
        new Date(now.getFullYear(), now.getMonth(), 1);

    const endOfMonth =
    new Date(now.getFullYear(), now.getMonth() + 2, 1);

    const response =
        await gapi.client.calendar.events.list({
            calendarId: "e375564db0eeb833828d26eb243128694362099650f0476566e26055a53f100d@group.calendar.google.com",
            timeMin: startOfMonth.toISOString(),
            timeMax: endOfMonth.toISOString(),
            maxResults: 250,
            singleEvents: true,
            orderBy: "startTime"
        });

    renderEvents(response.result.items);
}

function renderEvents(events) {

    const container = document.getElementById("calendar");

    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);

    const startWeekday = (firstDay.getDay() + 6) % 7;
    const daysInMonth = lastDay.getDate();
    const nextMonth = new Date(year, month + 1, 1);
    const nextMonthYear = nextMonth.getFullYear();
    const nextMonthMonth = nextMonth.getMonth();

    const eventsByDate = {};

    events.forEach(event => {

        let date;

if (event.start.date) {
    const parts = event.start.date.split("-");
    date = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );
} else {
    date = new Date(event.start.dateTime);
}

        const key =
            date.getFullYear() + "-" +
            String(date.getMonth() + 1).padStart(2, "0") + "-" +
            String(date.getDate()).padStart(2, "0");

        if (!eventsByDate[key]) {
            eventsByDate[key] = [];
        }

        eventsByDate[key].push(event);
});

const monthName = now.toLocaleString("default", {
    month: "long"
});

let html = `
    <div class="calendar-header">
        ${monthName}
        <span class="calendar-year">${year}</span>
    </div>

        <div class="calendar-grid">
            <div class="day-name">Mon</div>
            <div class="day-name">Tue</div>
            <div class="day-name">Wed</div>
            <div class="day-name">Thu</div>
            <div class="day-name">Fri</div>
            <div class="day-name">Sat</div>
            <div class="day-name">Sun</div>
    `;

    for (let i = 0; i < startWeekday; i++) {
        html += `<div class="calendar-day"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {

        const key =
            year + "-" +
            String(month + 1).padStart(2, "0") + "-" +
            String(day).padStart(2, "0");

        const isToday =
    day === now.getDate() &&
    month === now.getMonth() &&
    year === now.getFullYear();

html += `
    <div class="calendar-day ${isToday ? 'today' : ''}">
        <div class="day-number">${day}</div>
`;
        
        const dayEvents = eventsByDate[key] || [];

        dayEvents.forEach(event => {

            html += `
                <div class="calendar-event">
                    ${event.summary || "Event"}
                </div>
            `;
        });        
        
        html += `</div>`;
    }

const totalCells = startWeekday + daysInMonth;
const remainingCells = 42 - totalCells;

for (let day = 1; day <= remainingCells; day++) {

    const key =
        nextMonthYear + "-" +
        String(nextMonthMonth + 1).padStart(2, "0") + "-" +
        String(day).padStart(2, "0");

    const dayEvents = eventsByDate[key] || [];

    html += `
        <div class="calendar-day other-month">
            <div class="day-number">${day}</div>
    `;

    dayEvents.forEach(event => {
        html += `
            <div class="calendar-event">
                ${event.summary || "Event"}
            </div>
        `;
    });

    html += `</div>`;
}
    
    html += `</div>`;

    container.innerHTML = html;
}


        
setInterval(loadEvents, 60000);
    
initGoogle();
</script>

</body>
</html>
